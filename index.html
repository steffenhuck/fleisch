<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fleisch</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wrap">
    <h1 class="mast">Fleisch</h1>

    <section class="work">
      <h2 class="work-title">
        <a href="https://www.wzb.eu/de/forschung/beendete-forschungsprogramme/oekonomik-des-wandels/fleisch-und-farbe">
          Fleisch und Farbe
        </a>
      </h2>

      <figure class="hero">
        <img src="images/fleischundfarbe_01_cover.jpg" alt="Fleisch und Farbe — Cover" loading="lazy" decoding="async" />
      </figure>

      <div class="thumbs" aria-label="Fleisch und Farbe — Innenansichten">
        <img src="images/fleischundfarbe_02_raclette.jpg" alt="Fleisch und Farbe — Innenansicht 1" loading="lazy" decoding="async" />
        <img src="images/fleischundfarbe_03_grid.jpg" alt="Fleisch und Farbe — Innenansicht 2" loading="lazy" decoding="async" />
        <img src="images/fleischundfarbe_04_dark.jpg" alt="Fleisch und Farbe — Innenansicht 3" loading="lazy" decoding="async" />
      </div>
    </section>

    <section class="work">
      <h2 class="work-title">
        <a href="https://www.wzb.eu/de/news/nicht-orte-der-fleischindustrie">
          Nicht Orte der Fleischindustrie
        </a>
      </h2>

      <figure class="hero">
        <img src="images/nichtorte_01_cover.jpg" alt="Nicht Orte der Fleischindustrie — Cover" loading="lazy" decoding="async" />
      </figure>

      <div class="thumbs" aria-label="Nicht Orte der Fleischindustrie — Innenansichten">
        <img src="images/nichtorte_02_numbers.jpg" alt="Nicht Orte der Fleischindustrie — Innenansicht 1" loading="lazy" decoding="async" />
        <img src="images/nichtorte_03_map.jpg" alt="Nicht Orte der Fleischindustrie — Innenansicht 2" loading="lazy" decoding="async" />
        <img src="images/nichtorte_04_circle.jpg" alt="Nicht Orte der Fleischindustrie — Innenansicht 3" loading="lazy" decoding="async" />
      </div>
    </section>

    <footer class="foot" aria-hidden="true"></footer>
  </main>
</body>
</html>
